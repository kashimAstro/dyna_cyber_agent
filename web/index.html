*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{font-weight:800;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:11px;letter-spacing:0}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--mut);font-weight:600;white-space:nowrap}
nav button[aria-current=true]{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
nav button:hover{color:var(--txt)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--mut)}
main{max-width:1240px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:13px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.kpi .n{font-size:30px;font-weight:800;line-height:1.1}
.kpi .l{color:var(--mut);font-size:12.5px;margin-top:2px}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:#fff;white-space:nowrap}
.b4{background:var(--s4)}.b3{background:var(--s3)}.b2{background:var(--s2)}.b1{background:var(--s1)}.b0{background:var(--s0)}
:root[data-theme=dark] .badge{color:#0b1020}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .badge{color:#0b1020}}
.chip{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);margin:2px 4px 2px 0}
.chip.kev{color:var(--s4);border-color:var(--s4);font-weight:700}
.chip.new{color:var(--ok);border-color:var(--ok)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--mut)}
.sev{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.sev i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--mut)}
.legend b{color:var(--txt)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.item:first-child{border-top:0}
.item:hover{background:var(--panel2)}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
.item input[type=checkbox]{margin-top:5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.filters input[type=search]{flex:1;min-width:180px}
.btn{background:var(--acc);color:var(--accfg);border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
textarea{width:100%;min-height:84px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--mut);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.scroll{overflow-x:auto}
.progress{height:8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--acc)}
.drawer{position:fixed;inset:0;z-index:40;display:none}
.drawer.open{display:block}
.drawer .back{position:absolute;inset:0;background:rgba(2,6,23,.5)}
.drawer .panel{position:absolute;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);overflow-y:auto;padding:16px;border-left:1px solid var(--line)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--mut)}.kv dd{margin:0;overflow-wrap:anywhere}
.ai{background:color-mix(in srgb,var(--acc) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line));border-radius:10px;padding:12px;margin-top:12px}
.ai ol,.ai ul{margin:6px 0 0;padding-left:20px}
.warn{color:var(--s3)}
.err{background:color-mix(in srgb,var(--s4) 12%,var(--panel));border:1px solid var(--s4);border-radius:8px;padding:10px;margin:10px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:r 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
.mapwrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0a1020}
.mapwrap canvas{display:block;width:100%;aspect-ratio:2/1;min-height:260px;touch-action:none;cursor:grab}
.mapwrap canvas.drag{cursor:grabbing}
.tip{position:absolute;pointer-events:none;background:rgba(10,16,32,.96);color:#e6eaf3;border:1px solid #2a3a5c;border-radius:8px;padding:8px 10px;font-size:12.5px;max-width:270px;display:none;z-index:3}
.mapbtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapbtns button{width:34px;height:34px;border-radius:8px;border:1px solid #2a3a5c;background:rgba(10,16,32,.85);color:#e6eaf3;font-size:18px;cursor:pointer}
.maplegend{position:absolute;left:10px;bottom:8px;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#9aa6c0;background:rgba(10,16,32,.75);padding:4px 8px;border-radius:8px}
.maplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.bar2{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;min-width:60px}
.bar2 i{display:block;height:100%;background:var(--s3)}
iframe.pv{width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;background:#fff}
#login{max-width:420px;margin:12vh auto;padding:0 16px}
.hide{display:none!important}
.btn.danger{background:var(--s4);color:#fff}
:root[data-theme=dark] .btn.danger{color:#0b1020}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.danger{color:#0b1020}}
.dangercard{border-color:color-mix(in srgb,var(--s4) 55%,var(--line))}
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,6,23,.62);backdrop-filter:blur(3px);animation:fade .18s ease-out}
.modal .box{width:min(540px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 64px rgba(2,6,23,.5);animation:pop .24s cubic-bezier(.2,.9,.3,1.15)}
.modal .head{display:flex;gap:14px;align-items:center;padding:20px 22px 12px}
.modal .head h2{margin:0;font-size:19px}
.modal .head p{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
.modal .ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:800;flex:none;background:color-mix(in srgb,var(--s4) 15%,var(--panel));color:var(--s4)}
.modal .ico.ok{background:color-mix(in srgb,var(--ok) 15%,var(--panel));color:var(--ok)}
.modal .steps{display:flex;gap:6px;padding:0 22px}
.modal .steps i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .25s}
.modal .steps i.on{background:var(--s4)}
.modal .body{padding:14px 22px 4px;font-size:14px}
.modal .body p{margin:0 0 10px}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px 20px;flex-wrap:wrap}
.modal ul.del{margin:6px 0 12px;padding:10px 12px;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.modal ul.del li{font-size:13px;color:var(--mut)}
.modal ul.del b{color:var(--txt);font-variant-numeric:tabular-nums}
.modal label.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer;font-size:13.5px}
.modal label.chk input{margin-top:3px}
.modal .confirmbox{border:1px dashed var(--s4);border-radius:10px;padding:14px;margin:6px 0 10px;background:color-mix(in srgb,var(--s4) 6%,var(--panel));text-align:center}
.modal input.word{width:100%;margin-top:10px;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font:700 17px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:4px;text-align:center;text-transform:uppercase}
.modal input.word:focus{outline:2px solid var(--s4);outline-offset:1px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(2,6,23,.35);animation:pop .2s ease-out;max-width:calc(100vw - 32px)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(var(--tx,0),8px) scale(.97)}}
.toast{--tx:-50%}
.setgrid{display:grid;gap:14px}
.kv select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:inherit}
.xform{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:8px;margin:10px 0}
.xform input,.xform select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line)}
.pill.on{color:var(--ok);border-color:var(--ok)}
.pill.off{color:var(--s3);border-color:var(--s3)}
@media (max-width:520px){.modal ul.del{grid-template-columns:1fr}.modal .foot .btn{flex:1}}
@media (max-width:640px){.bar{flex-wrap:wrap}.brand small{display:none}.kpi .n{font-size:26px}}
</style>
</head>

function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(v==null||v===false)continue;
    if(k==="class")e.className=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(k==="checked"||k==="value"||k==="disabled")e[k]=v;
    else e.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;
}

function ts(t){return t?new Date(t*1000).toLocaleString(LANG==="en"?"en-GB":"it-IT",{dateStyle:"short",timeStyle:"short"}):T("mai");}

async function api(path,opts){
  const r=await fetch(path,{method:opts&&opts.method||"GET",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:opts&&opts.body?JSON.stringify(opts.body):undefined});
  if(r.status===401){logout(T("Token errato o scaduto."));throw new Error("401");}
  const j=await r.json().catch(()=>({error:T("risposta non valida")}));
  if(!r.ok)throw new Error(j.error||("HTTP "+r.status));
  return j;
}
async function pollJob(id,onTick){
  for(let i=0;i<400;i++){
    const j=await api("/api/jobs/"+encodeURIComponent(id));
    if(j.state!=="running")return j;
    if(onTick)onTick(i);
    await new Promise(r=>setTimeout(r,i<5?1000:3000));
  }
  throw new Error(T("tempo scaduto: l'analisi non e' ancora finita (controlla il log dell'agente)"));
}

  try{sessionStorage.removeItem("tk");}catch(e){}

function buildMap(items){
  const wrap=h("div",{class:"mapwrap"}),cv=h("canvas"),tip=h("div",{class:"tip"});
  const groups=new Map();
  for(const a of items){if(a.lat==null)continue;const k=a.lat.toFixed(1)+","+a.lon.toFixed(1);let g=groups.get(k);if(!g){g={lat:a.lat,lon:a.lon,cc:a.cc,city:a.city,region:a.region,items:[],attempts:0,risk:"low",last:0};groups.set(k,g);}

    tip.style.display="block";tip.style.left=Math.min(mx+14,cv.clientWidth-280)+"px";tip.style.top=Math.max(4,my+14)+"px";
